    <audio id="myAudio" src="dunglamtraitimanhdau.mp3" loop="loop" controls="controls"></audio>

    <script>
    // This function attempts to play the audio
    function playAudioOnInteraction() {
        const audio = document.getElementById('myAudio');
        
        audio.play()
        .then(() => {
            // Success! Remove the event listener so it doesn't keep triggering on future clicks
            document.removeEventListener('click', playAudioOnInteraction);
        })
        .catch((error) => {
            console.log("Playback failed or was blocked:", error);
        });
    }

    // Listen for a click anywhere on the document
    document.addEventListener('click', playAudioOnInteraction);
    </script>
